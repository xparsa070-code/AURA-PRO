<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ========== RESET & ROOT ========== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --bg-card: #1a1a26;
    --bg-card2: #1f1f2e;
    --accent: #7c3aed;
    --accent2: #a855f7;
    --accent3: #c084fc;
    --accent-glow: rgba(124,58,237,0.4);
    --accent-pink: #ec4899;
    --accent-cyan: #06b6d4;
    --accent-green: #10b981;
    --accent-orange: #f59e0b;
    --text-primary: #f0f0ff;
    --text-secondary: #9090b0;
    --text-muted: #5a5a7a;
    --border: rgba(255,255,255,0.07);
    --border-accent: rgba(124,58,237,0.3);
    --glass: rgba(255,255,255,0.04);
    --glass-hover: rgba(255,255,255,0.08);
    --shadow-accent: 0 0 30px rgba(124,58,237,0.3);
    --shadow-lg: 0 25px 60px rgba(0,0,0,0.6);
    --radius: 20px;
    --radius-sm: 12px;
    --radius-xs: 8px;
    --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    --transition-fast: all 0.15s ease;
    --font: 'Vazirmatn', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  html { font-size: 14px; scroll-behavior: smooth; }

  body {
    font-family: var(--font);
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow: hidden;
    position: relative;
    user-select: none;
  }

  /* ========== ANIMATED BACKGROUND ========== */
  .bg-animation {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    transition: filter 0.2s ease;
  }
  .bg-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.12;
    animation: orbFloat 12s ease-in-out infinite;
  }
  .bg-orb1 { width: 600px; height: 600px; background: var(--accent); top: -200px; left: -200px; animation-delay: 0s; }
  .bg-orb2 { width: 400px; height: 400px; background: var(--accent-pink); top: 50%; right: -150px; animation-delay: -4s; }
  .bg-orb3 { width: 300px; height: 300px; background: var(--accent-cyan); bottom: -100px; left: 30%; animation-delay: -8s; }
  @keyframes orbFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    33% { transform: translateY(-40px) scale(1.05); }
    66% { transform: translateY(20px) scale(0.95); }
  }

  /* Grid background */
  .bg-grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image:
      linear-gradient(rgba(124,58,237,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,58,237,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  .scanline-overlay {
    position: fixed;
    inset: 0;
    z-index: 9998;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.035) 0px,
      rgba(255,255,255,0.035) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
  }
  .scanline-overlay.active { opacity: 1; }

  .np-cover-ring {
    position: absolute;
    inset: -8px;
    border-radius: calc(var(--radius) + 8px);
    background: conic-gradient(var(--accent2) calc(var(--ring-pct, 0) * 1%), var(--border) 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }
  .np-cover-ring.active { opacity: 1; }

  /* ========== MAIN LAYOUT ========== */
  .app-container {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 260px 1fr 400px;
    grid-template-rows: 60px 1fr 120px;
    height: 100vh;
    gap: 0;
  }

  /* ========== SCROLLBAR ========== */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent2); }

  /* ========== TOP BAR ========== */
  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: rgba(10,10,15,0.8);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    z-index: 100;
  }
  .topbar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .logo-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent-pink));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    box-shadow: 0 0 20px rgba(124,58,237,0.5);
  }
  .logo-text { background: linear-gradient(135deg, var(--accent3), var(--accent-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .topbar-search {
    flex: 1;
    max-width: 400px;
    margin: 0 40px;
    position: relative;
  }
  .topbar-search input {
    width: 100%;
    padding: 8px 16px 8px 40px;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--text-primary);
    font-size: 0.9rem;
    outline: none;
    transition: var(--transition);
    font-family: var(--font);
  }
  .topbar-search input:focus {
    border-color: var(--border-accent);
    background: var(--glass-hover);
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .topbar-search input::placeholder { color: var(--text-muted); }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 14px;
  }

  .topbar-actions { display: flex; align-items: center; gap: 12px; }
  .topbar-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--glass);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
    font-size: 16px;
    position: relative;
  }
  .topbar-btn:hover { background: var(--glass-hover); color: var(--text-primary); border-color: var(--border-accent); }
  .topbar-btn.active { background: var(--accent); color: white; border-color: transparent; box-shadow: 0 0 15px var(--accent-glow); }
  .badge {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 16px;
    height: 16px;
    background: var(--accent-pink);
    border-radius: 50%;
    font-size: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 700;
  }

  /* ========== SIDEBAR ========== */
  .sidebar {
    grid-row: 2 / 3;
    background: rgba(18,18,26,0.6);
    backdrop-filter: blur(20px);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 0;
    display: flex;
    flex-direction: column;
  }
  .sidebar-section { margin-bottom: 8px; }
  .sidebar-label {
    padding: 8px 20px 4px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    cursor: pointer;
    transition: var(--transition-fast);
    border-radius: 0;
    color: var(--text-secondary);
    font-size: 0.9rem;
    font-weight: 500;
    position: relative;
  }
  .sidebar-item:hover { background: var(--glass); color: var(--text-primary); }
  .sidebar-item.active {
    background: linear-gradient(90deg, rgba(124,58,237,0.15), transparent);
    color: var(--accent3);
  }
  .sidebar-item.active::before {
    content: '';
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--accent);
    border-radius: 3px 0 0 3px;
  }
  .sidebar-item .icon { font-size: 18px; min-width: 22px; text-align: center; }
  .sidebar-item .count {
    margin-left: auto;
    background: var(--glass);
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 0.7rem;
    color: var(--text-muted);
  }

  .sidebar-playlist-cover {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    object-fit: cover;
    background: linear-gradient(135deg, var(--accent), var(--accent-pink));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .sidebar-divider { height: 1px; background: var(--border); margin: 8px 16px; }

  /* ========== MAIN CONTENT ========== */
  .main-content {
    grid-row: 2 / 3;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ========== SECTION HEADER ========== */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text-primary);
  }
  .section-title span { color: var(--accent3); }
  .section-link {
    font-size: 0.8rem;
    color: var(--accent2);
    cursor: pointer;
    transition: var(--transition-fast);
  }
  .section-link:hover { color: var(--accent3); }

  /* ========== CARDS GRID ========== */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }
  .music-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }
  .music-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent-glow), transparent);
    opacity: 0;
    transition: var(--transition);
  }
  .music-card:hover { border-color: var(--border-accent); transform: translateY(-4px); box-shadow: var(--shadow-accent); }
  .music-card:hover::before { opacity: 1; }
  .card-cover {
    width: 100%;
    aspect-ratio: 1;
    border-radius: var(--radius-xs);
    object-fit: cover;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, var(--bg-card2), var(--bg-primary));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }
  .card-play-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: var(--transition);
    border-radius: var(--radius-xs);
  }
  .music-card:hover .card-play-overlay { opacity: 1; }
  .card-play-btn {
    width: 44px;
    height: 44px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    box-shadow: 0 0 20px var(--accent-glow);
    transform: scale(0.8);
    transition: var(--transition);
  }
  .music-card:hover .card-play-btn { transform: scale(1); }
  .card-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-subtitle { font-size: 0.75rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ========== TRACK LIST ========== */
  .track-list { display: flex; flex-direction: column; gap: 4px; }
  .track-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: var(--radius-xs);
    cursor: pointer;
    transition: var(--transition-fast);
    border: 1px solid transparent;
    position: relative;
  }
  .track-item:hover { background: var(--glass); border-color: var(--border); }
  .track-item.active { background: rgba(124,58,237,0.1); border-color: var(--border-accent); }
  .track-item.active .track-title { color: var(--accent3); }
  .track-num {
    width: 28px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: 500;
    flex-shrink: 0;
  }
  .track-item.active .track-num { color: var(--accent2); }
  .track-cover {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-pink));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .track-info { flex: 1; min-width: 0; }
  .track-title { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-artist { font-size: 0.78rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-duration { color: var(--text-muted); font-size: 0.8rem; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .track-actions { display: flex; align-items: center; gap: 6px; opacity: 0; transition: var(--transition-fast); }
  .track-item:hover .track-actions { opacity: 1; }
  .track-action-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: var(--transition-fast);
  }
  .track-action-btn:hover { background: var(--glass-hover); color: var(--text-primary); }
  .track-action-btn.liked { color: var(--accent-pink); }

  /* ========== RIGHT PANEL ========== */
  .right-panel {
    grid-row: 2 / 3;
    background: rgba(18,18,26,0.6);
    backdrop-filter: blur(20px);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .panel-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    padding: 0 4px;
    flex-shrink: 0;
  }
  .panel-tab {
    flex: 1;
    padding: 14px 8px;
    text-align: center;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: var(--transition-fast);
    border-bottom: 2px solid transparent;
    letter-spacing: 0.3px;
  }
  .panel-tab:hover { color: var(--text-secondary); }
  .panel-tab.active { color: var(--accent3); border-bottom-color: var(--accent); }
  .panel-content { flex: 1; overflow-y: auto; padding: 16px; display: none; }
  .panel-content.active { display: block; }

  /* ========== MODALS ========== */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 9999;
    align-items: center;
    justify-content: center;
  }
  .modal.active {
    display: flex;
  }
  .modal-content {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    max-width: 500px;
    width: 90%;
  }
  .modal-header {
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--text-primary);
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 24px;
    cursor: pointer;
    transition: var(--transition-fast);
  }
  .modal-close:hover { color: var(--text-primary); }

  .file-input-wrapper {
    border: 2px dashed var(--border-accent);
    border-radius: var(--radius-sm);
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: var(--transition);
    background: rgba(124,58,237,0.05);
  }
  .file-input-wrapper:hover {
    background: rgba(124,58,237,0.1);
    border-color: var(--accent);
  }
  .file-input-wrapper input {
    display: none;
  }
  .upload-icon {
    font-size: 40px;
    margin-bottom: 12px;
  }
  .upload-text {
    color: var(--text-secondary);
    font-size: 0.9rem;
  }

  .modal-buttons {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }
  .btn {
    flex: 1;
    padding: 10px 16px;
    border-radius: var(--radius-xs);
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    transition: var(--transition-fast);
    font-family: var(--font);
  }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover {
    background: var(--accent2);
  }
  .btn-secondary {
    background: var(--glass);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover {
    background: var(--glass-hover);
    color: var(--text-primary);
  }

  .status-message {
    padding: 12px;
    border-radius: var(--radius-xs);
    margin-bottom: 12px;
    font-size: 0.9rem;
    display: none;
  }
  .status-message.success {
    background: rgba(16,185,129,0.2);
    border: 1px solid var(--accent-green);
    color: var(--accent-green);
    display: block;
  }
  .status-message.error {
    background: rgba(239,68,68,0.2);
    border: 1px solid #ef4444;
    color: #ef4444;
    display: block;
  }

  /* ========== BOTTOM PLAYER ========== */
  .bottom-player {
    grid-column: 1 / -1;
    background: rgba(10,10,15,0.95);
    backdrop-filter: blur(30px);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 300px 1fr 300px;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    z-index: 100;
    position: relative;
  }

  .player-now-playing {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .player-cover {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-pink));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    box-shadow: 0 0 20px rgba(124,58,237,0.3);
    cursor: pointer;
    transition: var(--transition);
  }
  .player-cover:hover { transform: scale(1.05); }
  .player-track-info { min-width: 0; flex: 1; }
  .player-title { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
  .player-artist { font-size: 0.78rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .player-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .player-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--glass);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition-fast);
    font-size: 16px;
  }
  .player-btn:hover {
    background: var(--glass-hover);
    color: var(--text-primary);
  }
  .player-btn.active {
    background: var(--accent);
    color: white;
    border-color: transparent;
  }

  .player-right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
  }
</style>
</head>
<body>

<div class="bg-animation">
  <div class="bg-orb bg-orb1"></div>
  <div class="bg-orb bg-orb2"></div>
  <div class="bg-orb bg-orb3"></div>
</div>
<div class="bg-grid"></div>
<div class="scanline-overlay"></div>

<div class="app-container">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-logo">
      <div class="logo-icon">🎵</div>
      <div class="logo-text">AURA</div>
    </div>
    <div class="topbar-search">
      <input type="text" placeholder="جستجو برای موسیقی...">
      <div class="search-icon">🔍</div>
    </div>
    <div class="topbar-actions">
      <button class="topbar-btn" id="addMusicBtn" title="افزودن موسیقی">
        <span>➕</span>
      </button>
      <button class="topbar-btn" title="تنظیمات">
        <span>⚙️</span>
      </button>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">منو</div>
      <div class="sidebar-item active">
        <span class="icon">🏠</span>
        <span>خانه</span>
      </div>
      <div class="sidebar-item">
        <span class="icon">❤️</span>
        <span>علاقه‌مندی‌ها</span>
        <span class="count">12</span>
      </div>
      <div class="sidebar-item">
        <span class="icon">⏱️</span>
        <span>اخیر</span>
      </div>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">
      <div class="sidebar-label">لیست‌های پخش</div>
      <div class="sidebar-item">
        <span class="sidebar-playlist-cover">🎧</span>
        <span>لیست‌ های من</span>
        <span class="count">5</span>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <div class="section-header">
      <h2 class="section-title">موسیقی <span>من</span></h2>
      <span class="section-link">نمایش همه</span>
    </div>
    <div class="cards-grid" id="musicGrid">
      <!-- Music cards will be rendered here -->
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="panel-tabs">
      <div class="panel-tab active">همین الان</div>
      <div class="panel-tab">لیست‌ها</div>
    </div>
    <div class="panel-content active" id="nowPlaying">
      <div style="text-align: center; color: var(--text-muted); padding: 20px;">
        در حال انتظار برای پخش موسیقی...
      </div>
    </div>
  </div>

  <!-- BOTTOM PLAYER -->
  <div class="bottom-player">
    <div class="player-now-playing">
      <div class="player-cover">🎵</div>
      <div class="player-track-info">
        <div class="player-title" id="playerTitle">انتخاب موسیقی</div>
        <div class="player-artist" id="playerArtist">AURA</div>
      </div>
    </div>
    <div class="player-controls">
      <button class="player-btn">⏮️</button>
      <button class="player-btn active" id="playBtn">▶️</button>
      <button class="player-btn">⏭️</button>
    </div>
    <div class="player-right">
      <span id="currentTime">0:00</span>
      <span>/</span>
      <span id="duration">0:00</span>
    </div>
  </div>
</div>

<!-- ADD MUSIC MODAL -->
<div class="modal" id="addMusicModal">
  <div class="modal-content" style="position: relative;">
    <button class="modal-close" onclick="document.getElementById('addMusicModal').classList.remove('active')">✕</button>
    <div class="modal-header">افزودن موسیقی جدید</div>
    
    <div class="status-message" id="statusMessage"></div>
    
    <div class="file-input-wrapper" id="fileInputWrapper">
      <div class="upload-icon">📁</div>
      <input type="file" id="musicInput" accept="audio/*" multiple>
      <div class="upload-text">
        <div style="margin-bottom: 8px;">برای انتخاب موسیقی کلیک کنید</div>
        <div style="font-size: 0.8rem; color: var(--text-muted);">یا فایل‌ها را اینجا رها کنید</div>
      </div>
    </div>

    <div class="modal-buttons">
      <button class="btn btn-secondary" onclick="document.getElementById('addMusicModal').classList.remove('active')">
        انصراف
      </button>
      <button class="btn btn-primary" id="confirmUploadBtn" onclick="uploadMusicFiles()">
        اضافه کردن
      </button>
    </div>
  </div>
</div>

<script>
// ========== MUSIC DATA MANAGEMENT ==========
const musicStorage = {
  // شناسه‌ی محلی برای نگهداری موسیقی‌ها
  key: 'auraMusicList',
  
  // دریافت تمام موسیقی‌ها
  getAll() {
    try {
      const data = localStorage.getItem(this.key);
      return data ? JSON.parse(data) : [];
    } catch (error) {
      console.error('خطا در دریافت موسیقی‌ها:', error);
      return [];
    }
  },

  // اضافه کردن موسیقی جدید
  add(music) {
    try {
      const musics = this.getAll();
      musics.push({
        id: Date.now().toString(),
        ...music,
        addedAt: new Date().toISOString()
      });
      localStorage.setItem(this.key, JSON.stringify(musics));
      return true;
    } catch (error) {
      console.error('خطا در اضافه کردن موسیقی:', error);
      return false;
    }
  },

  // حذف موسیقی
  remove(id) {
    try {
      const musics = this.getAll().filter(m => m.id !== id);
      localStorage.setItem(this.key, JSON.stringify(musics));
      return true;
    } catch (error) {
      console.error('خطا در حذف موسیقی:', error);
      return false;
    }
  }
};

// ========== UI FUNCTIONS ==========
function showStatus(message, type = 'success') {
  const statusEl = document.getElementById('statusMessage');
  statusEl.textContent = message;
  statusEl.className = `status-message ${type}`;
  
  if (type === 'success') {
    setTimeout(() => {
      statusEl.className = 'status-message';
    }, 3000);
  }
}

function uploadMusicFiles() {
  const input = document.getElementById('musicInput');
  const files = input.files;

  if (files.length === 0) {
    showStatus('لطفا حداقل یک فایل موسیقی انتخاب کنید', 'error');
    return;
  }

  showStatus('در حال اضافه کردن موسیقی...', 'success');

  // پردازش هر فایل
  Array.from(files).forEach(file => {
    if (!file.type.startsWith('audio/')) {
      showStatus(`فایل ${file.name} نوع موسیقی نیست`, 'error');
      return;
    }

    // استخراج نام فایل
    const fileName = file.name.split('.')[0];
    
    // خواندن فایل
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const musicData = {
          name: fileName,
          artist: 'نویسنده نامشخص',
          file: e.target.result,
          type: file.type,
          size: file.size
        };

        if (musicStorage.add(musicData)) {
          showStatus(`✅ موسیقی "${fileName}" با موفقیت اضافه شد`, 'success');
        } else {
          showStatus('خطا در اضافه کردن موسیقی', 'error');
        }
      } catch (error) {
        console.error('خطا در پردازش فایل:', error);
        showStatus(`خطا در پردازش "${fileName}"`, 'error');
      }
    };

    reader.onerror = () => {
      showStatus(`خطا در خواندن فایل "${file.name}"`, 'error');
    };

    reader.readAsArrayBuffer(file);
  });

  // بازرند کردن لیست
  setTimeout(() => {
    renderMusicGrid();
    input.value = '';
    document.getElementById('addMusicModal').classList.remove('active');
  }, 1000);
}

function renderMusicGrid() {
  const grid = document.getElementById('musicGrid');
  const musics = musicStorage.getAll();

  if (musics.length === 0) {
    grid.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 40px; grid-column: 1/-1;">موسیقی‌ای موجود نیست. افزودن کنید!</div>';
    return;
  }

  grid.innerHTML = musics.map(music => `
    <div class="music-card">
      <div class="card-cover">🎵</div>
      <div class="card-play-overlay">
        <div class="card-play-btn" onclick="playMusic('${music.id}')">▶️</div>
      </div>
      <div class="card-title">${music.name}</div>
      <div class="card-subtitle">${music.artist}</div>
    </div>
  `).join('');
}

function playMusic(id) {
  const musics = musicStorage.getAll();
  const music = musics.find(m => m.id === id);
  
  if (music) {
    document.getElementById('playerTitle').textContent = music.name;
    document.getElementById('playerArtist').textContent = music.artist;
    document.getElementById('playBtn').classList.add('active');
  }
}

// ========== EVENT LISTENERS ==========
document.addEventListener('DOMContentLoaded', () => {
  // بازرند اولیه
  renderMusicGrid();

  // دکمه‌ی اضافه کردن موسیقی
  document.getElementById('addMusicBtn').addEventListener('click', () => {
    document.getElementById('addMusicModal').classList.add('active');
  });

  // ورودی فایل
  document.getElementById('musicInput').addEventListener('change', uploadMusicFiles);

  // Drag and Drop
  const fileInputWrapper = document.getElementById('fileInputWrapper');
  fileInputWrapper.addEventListener('dragover', (e) => {
    e.preventDefault();
    fileInputWrapper.style.background = 'rgba(124,58,237,0.2)';
  });

  fileInputWrapper.addEventListener('dragleave', () => {
    fileInputWrapper.style.background = 'rgba(124,58,237,0.05)';
  });

  fileInputWrapper.addEventListener('drop', (e) => {
    e.preventDefault();
    fileInputWrapper.style.background = 'rgba(124,58,237,0.05)';
    
    const files = e.dataTransfer.files;
    document.getElementById('musicInput').files = files;
    uploadMusicFiles();
  });
});

// بستن مودال با کلید Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('addMusicModal').classList.remove('active');
  }
});
</script>

</body>
</html>
